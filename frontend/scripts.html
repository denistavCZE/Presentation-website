<!DOCTYPE html>
<html lang="cs">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Denis Lukosz</title>
      <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav>
      <a class="logo" href="index.html">denis<span class="logo-white">lukosz</span><span class="logo-extension">.cz</span></a>
      <ul class="nav-links">
        <li><a href="scripts.html">Scripts</a></li>
        <li><a href="models.html" class="active">3D Models</a></li>
        <li><a href="#">Maps</a></li>
        <li><a href="#">Mods</a></li>
        <li><a href="https://kozmicefiresportcalendar.azurewebsites.net" class="external">Firesport</a></li>
      </ul>
    </nav>

    <div class="page">
      <div class="page-header">
        <h1 class="page-title"><span>◈</span> Scripts</h1>
        <span class="page-count" id="scripts-count">// loading...</span>
      </div>

      <div class="search-bar">
        <input class="search-input" type="text" placeholder="// search scripts..." id="search" />
        <div class="tag-filter">
          <button class="tag active" onclick="filterTag(this, 'all')">all</button>
          <button class="tag" onclick="filterTag(this, 'weapon')">MSSQL</button>
          <button class="tag" onclick="filterTag(this, 'building')">C#</button>
        </div>
      </div>

      <div class="models-grid" id="grid">
        <div class="loading-state">
          <div class="dot-pulse"><span></span><span></span><span></span></div>
          fetching scripts...
        </div>
      </div>
    </div>

    <script>
      let allScripts = [];
      let activeTag = 'all';
      let searchVal = '';

      async function loadScripts() {
        try {
          const res = await fetch('/api/scripts');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const scripts = await res.json();
          allScripts = scripts;
          renderGrid(scripts);
        } catch (err) {
          document.getElementById('grid').innerHTML = `
            <div class="loading-state">// error loading scripts: ${err.message}</div>
          `;
        }
      }

      function renderGrid(scripts) {
        const grid = document.getElementById('grid');
        document.getElementById('scripts-count').textContent = `${scripts.length} script${scripts.length !== 1 ? 's' : ''}`;
        if (!scripts.length) {
          grid.innerHTML = `<div class="loading-state">no scripts found</div>`;
          return;
        }
        grid.innerHTML = scripts.map(m => `
          <div class="model-card">
            <div class="model-thumb">
              <div class="thumb-grid"></div>
              <div class="thumb-icon">◈</div>
            </div>
            <div class="model-info">
              <div class="model-name">${m.name}</div>
              <div class="model-desc">${m.desc}</div>
              <div class="model-footer">
                <span class="model-format">.${m.format.toLowerCase()}</span>
                <span class="model-dl">download ↓</span>
              </div>
            </div>
          </div>
        `).join('');
      }

      function applyFilters() {
        let filtered = allScripts;
        if (activeTag !== 'all') filtered = filtered.filter(m => m.tag === activeTag);
        if (searchVal) filtered = filtered.filter(m => m.name.toLowerCase().includes(searchVal));
        renderGrid(filtered);
      }

      function filterTag(el, tag) {
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        activeTag = tag;
        applyFilters();
      }

      document.getElementById('search').addEventListener('input', e => {
        searchVal = e.target.value.toLowerCase();
        applyFilters();
      });

      loadScripts();
    </script>
  </body>
</html>
