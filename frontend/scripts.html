<!DOCTYPE html>
<html lang="cs">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Denis Lukosz</title>
      <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav>
      <a class="logo" href="index.html">denis<span class="logo-white">lukosz</span><span class="logo-extension">.cz</span></a>
      <ul class="nav-links">
        <li><a href="scripts.html">Scripts</a></li>
        <li><a href="models.html" class="active">3D Models</a></li>
        <li><a href="maps.html">Maps</a></li>
        <li><a href="#">Mods</a></li>
        <li><a href="https://kozmicefiresportcalendar.azurewebsites.net" class="external">Firesport</a></li>
      </ul>
    </nav>

    <div class="page">
      <div class="page-header">
        <h1 class="page-title"><span>◈</span> Scripts</h1>
        <span class="page-count" id="scripts-count">loading...</span>
      </div>

      <div class="search-bar">
        <input class="search-input" type="text" placeholder="search scripts..." id="search" />
        <div class="tag-filter" id="tag-filter">
          <button class="tag active" onclick="filterTag(this, 'all')">all</button>
        </div>
      </div>

      <div class="models-grid" id="grid">
        <div class="loading-state">
          <div class="dot-pulse"><span></span><span></span><span></span></div>
          fetching scripts...
        </div>
      </div>
    </div>

    <script>
      const MOCK = [
        { name: "db_cleanup", extension: "sql", description: null, script: "#" },
        { name: "user_importer", extension: "cs", description: null, script: "#" },
        { name: "backup_script", extension: "ps1", description: null, script: "#" },
        { name: "deploy_tool", extension: "py", description: null, script: "#" },
        { name: "index_rebuild", extension: "sql", description: null, script: "#" },
      ];

     const SCRIPT_ICON = `<svg width="40" height="48" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <rect x="2" y="2" width="28" height="36" rx="3" fill="#0a0a0f" stroke="#888" stroke-width="1.5"/>
                          <path d="M24 2l8 8H24V2z" fill="#0f0f1a" stroke="#888" stroke-width="1"/>
                          <line x1="5" y1="16" x2="27" y2="16" stroke="#888" stroke-width="1"/>
                          <line x1="5" y1="20" x2="27" y2="20" stroke="#888" stroke-width="1"/>
                          <line x1="5" y1="24" x2="22" y2="24" stroke="#888" stroke-width="1"/>
                        </svg>`;

      let allScripts = [];
      let activeTag = 'all';
      let searchVal = '';

      async function loadScripts() {
        try {
          // DEV Stuff
          // await new Promise(r => setTimeout(r, 800));
          // const scripts = MOCK;
          
          const res = await fetch('/api/GetItems?type=scripts');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const scripts = await res.json();
          allScripts = scripts;
          buildTagFilters(allScripts);
          renderGrid(scripts);
        } catch (err) {
          document.getElementById('grid').innerHTML = `
            <div class="loading-state">error loading scripts: ${err.message}</div>
          `;
        }
      }

      function buildTagFilters(scripts) {
        const extensions = [...new Set(scripts.map(s => s.extension).filter(Boolean))];
        const container = document.getElementById('tag-filter');
        extensions.forEach(ext => {
          const btn = document.createElement('button');
          btn.className = 'tag';
          btn.textContent = `.${ext}`;
          btn.onclick = () => filterTag(btn, ext);
          container.appendChild(btn);
        });
      }



      function renderGrid(scripts) {
        const grid = document.getElementById('grid');
        document.getElementById('scripts-count').textContent = `${scripts.length} script${scripts.length !== 1 ? 's' : ''}`;
        if (!scripts.length) {
          grid.innerHTML = `<div class="loading-state">no scripts found</div>`;
          return;
        }
        grid.innerHTML = scripts.map(m => `
          <div class="model-card">
            <div class="model-thumb">
              <div class="thumb-grid"></div>
              <div class="script-icon">${SCRIPT_ICON}</div>
            </div>
            <div class="model-info">
              <div class="model-name">${m.name}</div>
              <div class="model-footer">
                <span class="model-format">.${m.extension ?? '?'}</span>
                <a href="${m.script}" download class="model-dl">download ↓</a>
              </div>
            </div>
          </div>
        `).join('');
      }

      function applyFilters() {
        let filtered = allScripts;
        if (activeTag !== 'all') filtered = filtered.filter(m => m.extension === activeTag);
        if (searchVal) filtered = filtered.filter(m => m.name.toLowerCase().includes(searchVal));
        renderGrid(filtered);
      }

      function filterTag(el, tag) {
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        activeTag = tag;
        applyFilters();
      }

      document.getElementById('search').addEventListener('input', e => {
        searchVal = e.target.value.toLowerCase();
        applyFilters();
      });

      loadScripts();
    </script>
  </body>
</html>
